<!DOCTYPE html>
<html>
<head>
  <title>Filter Restaurants</title>
  <link rel="stylesheet" href="style.css">
</head>
<body onload="initFilterPage()">

<header>
  <h1>NYC Restaurant Inspection Explorer</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="filter.html">Filter Data</a>
    <a href="analysis.html">Analysis</a>
  </nav>
</header>

<main>
  <section class="intro">
    <h2>Restaurant Inspection Results</h2>
    <p>
      Use this page to view restaurant inspection records from NYC Open Data. You can filter the cards
      by borough, inspection grade, and restaurant name.
    </p>
  </section>

  <section class="filter-box">
    <label for="boroughSelect">Filter by Borough:</label>
    <select id="boroughSelect" onchange="filterCards()">
      <option value="All">All</option>
      <option value="Manhattan">Manhattan</option>
      <option value="Brooklyn">Brooklyn</option>
      <option value="Queens">Queens</option>
      <option value="Bronx">Bronx</option>
      <option value="Staten Island">Staten Island</option>
    </select>

    <label for="gradeSelect">Filter by Grade:</label>
    <select id="gradeSelect" onchange="filterCards()">
      <option value="All">All</option>
      <option value="A">A</option>
      <option value="B">B</option>
      <option value="C">C</option>
      <option value="N">N</option>
      <option value="Z">Z</option>
    </select>

    <label for="nameInput">Search Restaurant:</label>
    <input type="text" id="nameInput" placeholder="Type restaurant name" onkeyup="filterCards()">
  </section>

  <p id="resultCount"></p>

  <div id="output" class="card-container"></div>
</main>

<script src="script.js"></script>
</body>
</html>
